services:
  # 1. Backend Service (FastAPI Python)
  - type: web
    name: m45-qc-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: M45_CORS_ORIGINS
        value: "https://m45-qc-frontend.onrender.com,http://localhost:3000,http://localhost:8088"
      - key: M45_FORCE_DEMO
        value: "0"

  # 2. Frontend Service (React Vite Static - KHÔNG để trường plan vì static mặc định free)
  - type: web
    name: m45-qc-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://m45-qc-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
